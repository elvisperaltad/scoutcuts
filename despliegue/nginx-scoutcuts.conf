# ScoutCuts: nginx con TLS.
# Archivo de referencia versionado; se instala en /etc/nginx/sites-available/scoutcuts.
# El certificado lo emite certbot para scoutcuts.com, www, api y descargas.
#
# La API vive en /opt/cortador-control/app y escribe sus datos en
# /opt/cortador-control/datos. La entrega de resultados usa X-Accel-Redirect:
# nginx (usuario www-data) necesita poder ATRAVESAR y LEER esas carpetas, por
# eso /opt/cortador-control/datos/trabajos se crea con el grupo `entrega`
# (cortador + www-data) y permisos 2750 (setgid).
#
# Lo mismo vale para /opt/cortador-control/instaladores (el ZIP que entrega
# descargas.scoutcuts.com): root:entrega 2750, para que www-data lo lea y
# cortador solo pueda comprobar que existe, sin poder escribirlo.

# Limites por IP para la subida de video (hallazgo de la revision de
# seguridad independiente: el candado de aplicacion solo evita DOS subidas
# simultaneas en TODO el servicio, pero no evita que una sola IP abra muchas
# conexiones nuevas por segundo, cada una ocupando un slot de proceso de
# nginx/uvicorn hasta recibir el 503 o el 401). Estas directivas van en
# contexto http (este archivo se incluye desde sites-enabled dentro de
# nginx.conf, que ya esta en contexto http). 1 subida en curso por IP,
# rafagas cortas, sin encolar conexiones de mas (nodelay): el servidor ya
# tiene su propia cola de un solo carril, no hace falta otra en nginx.
limit_req_zone $binary_remote_addr zone=subidas_por_ip:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conexiones_por_ip:10m;

# Limite por IP para el formulario de descarga del instalador
# (descargas.scoutcuts.com). El codigo de acceso son 8 caracteres de un
# alfabeto reducido: sin un freno aqui, una sola IP podria probar miles de
# codigos por minuto contra POST /v1/descargas/instalador. 12r/m deja margen
# de sobra para quien se equivoca al teclear (una vez cada 5 segundos) y
# convierte la fuerza bruta en algo inviable. Zona propia, no la de subidas:
# agotar el presupuesto de descargas no debe bloquear la subida de un video
# ni al contrario.
limit_req_zone $binary_remote_addr zone=codigos_por_ip:10m rate=12r/m;

# Redireccion de todo el trafico sin cifrar, dejando paso a las validaciones ACME.
server {
    listen 80;
    listen [::]:80;
    server_name scoutcuts.com www.scoutcuts.com api.scoutcuts.com descargas.scoutcuts.com;

    location /.well-known/acme-challenge/ {
        root /var/www/scoutcuts;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Sitio publico: la PWA de ScoutCuts.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scoutcuts.com www.scoutcuts.com;

    ssl_certificate /etc/letsencrypt/live/scoutcuts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoutcuts.com/privkey.pem;
    include /etc/nginx/snippets/scoutcuts-tls.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Subida de video por POST /v1/pwa/trabajos. Mismo margen que api.scoutcuts.com.
    client_max_body_size 550m;

    root /var/www/scoutcuts;
    index index.html;

    # El service worker debe revalidarse siempre: si queda cacheado por el
    # navegador con TTL largo, una actualizacion del cascaron nunca llega a
    # los scouts que ya instalaron la PWA.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # La API de la PWA vive en el mismo proceso que api.scoutcuts.com: se
    # sirve bajo el mismo origen (scoutcuts.com) para que el navegador nunca
    # tenga que hacer una peticion cross-origin (sin preflight CORS extra,
    # sin depender de que el scout tenga cookies de terceros habilitadas).
    location = /v1/pwa/trabajos {
        limit_req zone=subidas_por_ip burst=2 nodelay;
        limit_conn conexiones_por_ip 2;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location /v1/pwa/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /salud {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
    }

    # Zona de entrenamiento: mismo backend, mismo origen (sin CORS extra),
    # bajo su propio prefijo. Es PUBLICA a proposito (se entra solo con el
    # enlace, sin token ni login: ver api.py, seccion "Zona de entrenamiento
    # publica"), asi que estos limites por IP son el freno principal al
    # abuso, no un extra -- no quitarlos. La subida de video de practica usa
    # el mismo limite de tamano/IP que la PWA real.
    #
    # La ruta real es POST /v1/entrenamiento/{disciplina}/videos (api.py,
    # seccion "Zona de entrenamiento publica") desde que se generalizo a las
    # 4 disciplinas -- el "videos" ya no es el ultimo segmento fijo, por eso
    # esto usa una regex y no `location =` exacto (un `location =` con la
    # ruta vieja de un solo segmento nunca volveria a hacer match: la
    # subida real caeria en el bloque generico de abajo, SIN limite de
    # tasa por IP ni proxy_request_buffering off).
    location ~ ^/v1/entrenamiento/[^/]+/videos$ {
        limit_req zone=subidas_por_ip burst=2 nodelay;
        limit_conn conexiones_por_ip 2;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location /v1/entrenamiento/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# API de subida/consulta/descarga de videos.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.scoutcuts.com;

    ssl_certificate /etc/letsencrypt/live/scoutcuts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoutcuts.com/privkey.pem;
    include /etc/nginx/snippets/scoutcuts-tls.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Subida de video por POST /v1/trabajos. El limite real lo aplica la API
    # (500 MB); aqui se deja margen para la cabecera multipart.
    client_max_body_size 550m;

    # Entrega interna del montaje via X-Accel-Redirect. Nunca se expone
    # directamente: solo responde a una redireccion interna emitida por la API.
    location /protegido/ {
        internal;
        alias /opt/cortador-control/datos/trabajos/;
    }

    location = /v1/trabajos {
        # Solo el POST de subida necesita el freno por IP: limitarlo tambien
        # en GET /v1/trabajos/{id} (consulta de estado, el scout la llama
        # seguido mientras espera) molestaria sin necesidad.
        limit_req zone=subidas_por_ip burst=2 nodelay;
        limit_conn conexiones_por_ip 2;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Subidas grandes: no almacenar en buffer en disco toda la peticion.
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Subidas grandes: no almacenar en buffer en disco toda la peticion.
        proxy_request_buffering off;
    }
}

# Entrega del instalador. La carpeta de instaladores nunca se expone
# directamente: solo sale por una redireccion interna que emite la API tras
# validar el codigo de acceso.
#
# Este host NO es un espejo de la API: antes tenia un `location /` que
# proxeaba TODO a 127.0.0.1:8010, asi que cualquier ruta de la API real
# (subida de videos, consulta de trabajos, zona de entrenamiento) tambien
# contestaba por descargas.scoutcuts.com, sin los limites por IP que si
# estan puestos en sus hosts propios. Ahora solo existen las dos rutas de
# descarga; el resto es HTML estatico o 404. Cualquier ruta nueva de la API
# que haga falta aqui hay que agregarla a mano, a proposito.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name descargas.scoutcuts.com;

    ssl_certificate /etc/letsencrypt/live/scoutcuts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scoutcuts.com/privkey.pem;
    include /etc/nginx/snippets/scoutcuts-tls.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # CSP a la medida de este host y de nada mas. La portada (web-descargas/
    # index.html) y la pagina equivalente de la API no cargan NADA externo:
    # cero JavaScript, estilos en un <style> embebido (y dos atributos
    # style="..." sueltos), icono en data: y el SVG de la marca escrito
    # dentro del HTML. Por eso:
    #   default-src 'none'  -> nada que no este permitido abajo (ni scripts,
    #                          ni fuentes, ni conexiones, ni frames)
    #   style-src 'unsafe-inline' -> el <style> y los atributos style; sin
    #                          'self' porque no hay ni un .css en disco
    #   img-src data:       -> solo el favicon embebido, ninguna URL externa
    #   form-action 'self'  -> el POST del codigo solo puede ir a este origen
    #   base-uri 'none'     -> un <base> inyectado no puede redirigir rutas
    #   frame-ancestors 'none' -> nadie enmarca el formulario (refuerza el
    #                          X-Frame-Options del resto de hosts)
    # Si algun dia la portada necesita JS o una hoja .css aparte, hay que
    # ampliar esta linea a proposito: tal como esta, el navegador lo bloquea.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    # Este host no pide permisos del dispositivo en ningun momento (el video
    # se sube desde la PWA, en otro origen). Se niegan explicitamente para
    # que ni un iframe ni un HTML futuro los pueda estrenar por descuido.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Solo entra el formulario (un codigo de acceso de 12 caracteres como
    # maximo). Nada de subidas por este host.
    client_max_body_size 1m;

    # La validacion ACME de certbot (http-01) sigue entrando por el bloque
    # :80 de arriba, que la sirve desde /var/www/scoutcuts para los cuatro
    # nombres. Este root es solo para la portada de descargas, y el
    # despliegue lo publica con rsync --delete excluyendo .well-known.
    root /var/www/scoutcuts-descargas;
    index index.html;

    # Portada estatica: la pinta nginx desde disco, la API ni se entera.
    # Ojo: no poner un add_header aqui sin repetir los cinco del server
    # (HSTS, nosniff, Referrer-Policy, CSP, Permissions-Policy); un
    # add_header en el location los reemplaza en vez de sumarse.
    location = / {
        try_files /index.html =404;
    }

    # Pagina de la API (mismo formulario, sin estilos) y destino de los
    # errores del POST: 401 codigo invalido, 503 instalador no disponible.
    location = /v1/descargas {
        limit_req zone=codigos_por_ip burst=5 nodelay;
        limit_conn conexiones_por_ip 4;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # POST del formulario. La API solo autoriza (cuerpo vacio) y devuelve
    # X-Accel-Redirect /protegido/<nombre>; el ZIP lo envia nginx desde
    # disco, sin que Python lea un solo byte de ~231 MiB.
    location = /v1/descargas/instalador {
        limit_req zone=codigos_por_ip burst=5 nodelay;
        # Cuenta descargas en curso, no intentos: 4 por IP tolera una oficina
        # o un celular tras NAT sin dejar que una sola IP ocupe el servidor.
        limit_conn conexiones_por_ip 4;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # El Content-Disposition lo fija /protegido/ de abajo. Si tambien se
        # dejara pasar el de la API, el navegador recibiria la cabecera dos
        # veces (y algunos se quedan con la peor). Content-Type NO se oculta:
        # las respuestas 401/503 de esta misma ruta son HTML y necesitan el
        # suyo.
        proxy_hide_header Content-Disposition;
    }

    # Entrega interna del ZIP. `internal` = solo accesible por una
    # redireccion interna de nginx; una peticion directa a
    # /protegido/... desde fuera recibe 404, nunca el archivo.
    location /protegido/ {
        internal;
        alias /opt/cortador-control/instaladores/;

        # Nombre de archivo fijo, igual que la constante NOMBRE_INSTALADOR de
        # la API: nunca se construye con datos de la peticion.
        add_header Content-Disposition 'attachment; filename="CortadorTurnosQA-Portable.zip"' always;
        # Los add_header de un location NO se suman a los del server: lo
        # reemplazan por completo. Como este bloque es el que responde la
        # descarga de verdad, hay que repetir aqui las cabeceras de seguridad
        # del server o el ZIP se enviaria sin ellas.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # La CSP no cambia nada para un ZIP que el navegador solo guarda,
        # pero se repite igual: asi la respuesta de la descarga no es la
        # unica de este host que sale sin ella (y si algun dia un navegador
        # decidiera mostrar el contenido en vez de bajarlo, sigue sin poder
        # ejecutar nada).
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Tabla de tipos minima para esta carpeta: solo ZIP. Cualquier otra
        # cosa sale como octet-stream, nunca como HTML interpretable.
        types { application/zip zip; }
        default_type application/octet-stream;

        # Descarga larga de un archivo grande por una conexion de celular.
        send_timeout 300s;
        # Sin listados de la carpeta en ningun caso (es el default de nginx;
        # explicito para que nadie lo active aqui por costumbre).
        autoindex off;
    }

    # Resto del host: archivos estaticos de la portada y nada mas. Sin
    # fallback a la API y sin listados de directorio.
    location / {
        autoindex off;
        try_files $uri =404;
    }
}
